name: Deploy

# Push to main: test, publish the image to GHCR and roll it out on the fvrt mini PC over Tailscale
# (SSH key restricted by a forced command on the host: git pull + compose pull/up of contorno only).
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "!apps/web/android/**"
      - "package*.json"
      - "tsconfig.base.json"
      - "Dockerfile"
      - "docker-compose.prod.yml"
      - ".github/workflows/cd.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: contorno-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/eduardofavarato/contorno:latest
            ghcr.io/eduardofavarato/contorno:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: deploy contorno
